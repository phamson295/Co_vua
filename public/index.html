<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cờ vua</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <h1>♞ Cờ vua</h1>

    <section id="menu" class="card">
      <button id="btn-local" class="btn primary">Hai người (cùng một điện thoại)</button>
      <button id="btn-ai" class="btn primary">Chơi với máy</button>
      <button id="btn-online" class="btn primary">Chơi online</button>
    </section>

    <section id="ai-setup" class="card" hidden>
      <h2>Chơi với máy</h2>
      <label class="field">
        Bạn cầm quân
        <select id="ai-color">
          <option value="w">Trắng (đi trước)</option>
          <option value="b">Đen</option>
          <option value="r">Ngẫu nhiên</option>
        </select>
      </label>
      <label class="field">
        Cấp độ: <strong id="level-text"></strong>
        <input id="ai-level" type="range" min="1" max="12" value="5">
        <span class="hint">1 là dễ nhất, 12 là mạnh nhất.</span>
      </label>
      <button id="ai-start" class="btn primary">Bắt đầu</button>
      <button class="btn" data-home>Quay lại</button>
    </section>

    <section id="online-setup" class="card" hidden>
      <h2>Chơi online</h2>
      <button id="create-room" class="btn primary">Tạo phòng mới</button>
      <div class="join">
        <input id="room-code" maxlength="5" placeholder="Nhập mã phòng" autocomplete="off" autocapitalize="characters">
        <button id="join-room" class="btn primary">Vào phòng</button>
      </div>
      <p id="online-msg" class="msg"></p>
      <button class="btn" data-home>Quay lại</button>
    </section>

    <section id="game" hidden>
      <div class="info">
        <span id="mode-text"></span>
        <span id="turn-text" class="turn"></span>
      </div>

      <div id="board" class="board" aria-label="Bàn cờ"></div>

      <p id="status" class="status" aria-live="polite"></p>

      <div class="controls">
        <button id="undo" class="btn">Hoàn tác</button>
        <button id="resign" class="btn danger">Đầu hàng</button>
        <button class="btn" data-home>Về menu</button>
      </div>
      <label id="rotate-option" class="toggle">
        <input id="auto-rotate" type="checkbox" checked>
        Xoay bàn cờ theo lượt (để người chơi ngồi đối diện)
      </label>

      <p id="moves" class="moves"></p>
    </section>
  </main>

  <div id="promo" class="overlay" hidden>
    <div class="dialog">
      <p>Chọn quân để phong cấp:</p>
      <div id="promo-choices" class="promo-choices"></div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
